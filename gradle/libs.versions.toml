# Dependency version catalog.
#
# Every AndroidX and AGP line below was checked against Google Maven on
# 2026-09-17, from a machine that can reach it (the container that scaffolded
# this project could not, which is why these used to be marked UNVERIFIED), and
# the whole project builds locally on them. "current" means latest stable as of
# that date.
#
# Five of them (activity-compose, lifecycle, datastore, work, glance) were
# behind that day with no Dependabot PR offering them, so "no open Dependabot
# PR" is not evidence of currency here. Check Google Maven directly.

[versions]
# Build tooling
agp = "9.4.0" # current; needs Gradle >= 9.6.0, wrapper is 9.7.1
kotlin = "2.4.20" # VERIFIED — Maven Central, org.jetbrains.kotlin:kotlin-gradle-plugin
compileSdk = "37" # Required by the AndroidX artifacts in PRs #1 and #6; AGP 9.4.0 supports it
targetSdk = "35" # Deliberately NOT moved with compileSdk — targetSdk opts the app in to new
# runtime behaviour and needs testing on a device, which nothing here can do yet. The README
# flags it as likely at or below the Play Store floor; that is a release decision, not a bump.
minSdk = "26" # Android 8.0 — chosen baseline, not a lookup; raise/lower as needed

# Kotlin ecosystem
coroutines = "1.11.0" # VERIFIED — Maven Central, kotlinx-coroutines-android
serialization-json = "1.11.0" # VERIFIED — Maven Central, kotlinx-serialization-json (latest stable, excludes 1.12.0-RC)

# AndroidX
core-ktx = "1.19.0" # current
appcompat = "1.8.0" # current
activity-compose = "1.13.0" # current
lifecycle = "2.11.0" # current
compose-bom = "2026.09.00" # current
datastore = "1.2.1" # current
work = "2.11.2" # current
glance = "1.2.0" # current
security-crypto = "1.1.0" # current; was 1.1.0-alpha06 until PR #5
navigation-compose = "2.10.1" # current — but referenced by no module, so no build has ever resolved it

# Test
junit5 = "6.1.3" # test-only, :protocol
junit4 = "4.13.2" # current (Maven Central)
androidx-test-ext = "1.3.0" # current
espresso = "3.7.0" # current

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
