name: CI

on:
  push:
    # Every branch, not just the default one: the release workflow's gate
    # requires a passing CI run for the exact commit being tagged, and a
    # pre-release tag (v1.0.0-dev.1) is explicitly allowed to come from a
    # feature branch. If CI never ran there, that tag can never be released.
    branches: ['**']
  pull_request:
    # Any base branch, for the same reason the push trigger takes any branch:
    # this repository has no main or master. Its default branch is the one the
    # work is on, so `[main, master]` matched nothing and never had — every
    # pull request opened here, Dependabot's included, ran no checks at all
    # from this trigger. Four of the seven Dependabot PRs open in September
    # 2026 had therefore never been built once, and showed an empty check list
    # rather than a red one, which reads far too much like "fine".
    branches: ['**']
  # The gate's error message tells you to dispatch CI by hand when no run
  # exists for a commit. That advice only works if this trigger is here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # head_ref before ref, because the two triggers above now overlap: a pull
  # request inside this repository fires `push` on the branch AND
  # `pull_request` on the same commits, and `github.ref` differs between them
  # (refs/heads/<branch> versus refs/pull/<n>/merge) so they would land in
  # separate groups and build the same tree twice. `github.head_ref` is the
  # branch name on a pull_request event and empty everywhere else, so this
  # collapses the pair into one group and leaves plain branch pushes exactly
  # as they were.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Runs first because it is the fastest failure signal in the build: the
      # frame/keystream math is the part with real test coverage, so a
      # regression there surfaces in seconds instead of after the full Android
      # compile. Note this does NOT make the step independent of AGP —
      # Gradle configures every project before running any task, so the root
      # and :app plugin blocks resolve AGP first regardless of which module
      # the task belongs to.
      - name: Test :protocol (pure JVM)
        run: ./gradlew :protocol:test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      # The debug APK is the one you can actually install to test with: Gradle
      # signs it with the local debug keystore, so unlike the release APK it
      # needs no secrets. Building it without publishing it anywhere left
      # nothing to download, which is the whole point of a CI build for an app.
      # Retention is short because these are throwaway test builds.
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerview-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Exercises R8 on every push. Without this, a bad/missing keep rule only
      # ever shows up during a release build, which is the worst time to find it.
      - name: Build release APK (exercises R8 shrinking)
        run: ./gradlew assembleRelease

      # ADAPT: enable once the app has enough surface area for lint to be worth
      # gating on. Left off deliberately — turning it on blind, in a container
      # with no Android SDK to run it in first, is a good way to hand you a red
      # CI on the run that is supposed to prove CI works again.
      # - name: Lint
      #   run: ./gradlew lint
