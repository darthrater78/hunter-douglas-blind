name: CI

on:
  push:
    # Every branch, not just the default one: the release workflow's gate
    # requires a passing CI run for the exact commit being tagged, and a
    # pre-release tag (v1.0.0-dev.1) is explicitly allowed to come from a
    # feature branch. If CI never ran there, that tag can never be released.
    branches: ['**']
  pull_request:
    # Any base branch, for the same reason the push trigger takes any branch:
    # this repository has no main or master. Its default branch is the one the
    # work is on, so `[main, master]` matched nothing and never had — every
    # pull request opened here, Dependabot's included, ran no checks at all
    # from this trigger. Four of the seven Dependabot PRs open in September
    # 2026 had therefore never been built once, and showed an empty check list
    # rather than a red one, which reads far too much like "fine".
    branches: ['**']
  # The gate's error message tells you to dispatch CI by hand when no run
  # exists for a commit. That advice only works if this trigger is here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Both halves are deliberately branch NAMES, because the two triggers above
  # overlap: a pull request inside this repository fires `push` on the branch
  # and `pull_request` on the same commits, and without this they build the
  # same tree twice.
  #
  # The pairing has to be exact to collapse, which is easy to get subtly wrong:
  #
  #   push          github.ref      refs/heads/<branch>   github.ref_name  <branch>
  #   pull_request  github.ref      refs/pull/<n>/merge   github.head_ref  <branch>
  #
  # `head_ref || ref` does NOT work — it yields `<branch>` for the pull request
  # and `refs/heads/<branch>` for the push, which are different strings, so both
  # runs survive. PRs #1 and #6 each ran `build` twice under exactly that
  # mistake. `ref_name` is the branch name with the refs/heads/ prefix already
  # stripped, so `head_ref || ref_name` matches on both sides.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Runs first because it is the fastest failure signal in the build: the
      # frame/keystream math is the part with real test coverage, so a
      # regression there surfaces in seconds instead of after the full Android
      # compile. Note this does NOT make the step independent of AGP —
      # Gradle configures every project before running any task, so the root
      # and :app plugin blocks resolve AGP first regardless of which module
      # the task belongs to.
      - name: Test :protocol (pure JVM)
        run: ./gradlew :protocol:test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      # The debug APK is the one you can actually install to test with: Gradle
      # signs it with the local debug keystore, so unlike the release APK it
      # needs no secrets. Building it without publishing it anywhere left
      # nothing to download, which is the whole point of a CI build for an app.
      # Retention is short because these are throwaway test builds.
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerview-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Exercises R8 on every push. Without this, a bad/missing keep rule only
      # ever shows up during a release build, which is the worst time to find it.
      - name: Build release APK (exercises R8 shrinking)
        run: ./gradlew assembleRelease

      # Full lint on every module. assembleRelease above only runs
      # lintVitalRelease, which passed while full lint was failing, and full
      # lint's MissingPermission/InlinedApi findings are what led to a real bug
      # (scanning checked BLUETOOTH_SCAN on API 26-30, where it does not exist,
      # so Android 8-11 never scanned). Enabled after passing locally.
      - name: Lint
        run: ./gradlew lint
