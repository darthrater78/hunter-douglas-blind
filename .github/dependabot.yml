version: 2
updates:
  # GitHub Actions — keeps SHA pins and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Gradle — covers build.gradle.kts / settings.gradle.kts / gradle/libs.versions.toml
  # across every module. This is version updates only. Advisory-driven security
  # updates are not configured here: they come from the repository's Dependabot
  # alerts and security updates settings, both enabled as of 2026-09-17.
  #
  # An empty queue is not proof of currency. On 2026-09-17, with nothing open,
  # five AndroidX lines were still behind their latest stable release; see the
  # BEHIND markers in libs.versions.toml.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
