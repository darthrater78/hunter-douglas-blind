org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Built-in Kotlin, deliberately opted out of — for now, and not silently.
#
# AGP 9.0 introduced built-in Kotlin support and enables it by default, which
# makes applying org.jetbrains.kotlin.android a hard error rather than a
# redundancy:
#
#   The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin
#   support since AGP 9.0.
#
# That is what CI run #38 failed on. The documented migration is small — drop
# the plugin from the five Android modules, the root build file and the version
# catalog — but it hands Kotlin compilation to the version of Kotlin that AGP
# bundles, while the Compose compiler plugin here is pinned to the catalog's
# kotlin = 2.4.20. Those two have to agree, and which Kotlin AGP 9.4.0 bundles
# cannot be checked from this container at all: Google Maven is unreachable
# (maven.google.com redirects to dl.google.com, which the environment's network
# policy denies), so AGP never resolves locally and CI is the only compiler.
#
# So the two majors are separated rather than guessed at together. This flag
# keeps the known-good pairing — kotlin-android 2.4.20 driving compilation,
# compose 2.4.20 matching it — so that "move to AGP 9" is one change with one
# verdict, and "adopt built-in Kotlin" is the next one with its own.
#
# android.newDsl must go with it: the kotlin-android plugin is not compatible
# with the new DSL, so opting out of one requires opting out of the other.
#
# This is temporary by design and the build will say so on every run. AGP 10.0
# removes the ability to opt out, so the migration is owed before that upgrade.
# Steps: https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
